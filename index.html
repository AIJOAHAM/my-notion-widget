<body>



    <div class="quote-card" id="quoteCard" onclick="openNotionPage()">

        <div class="hint-icon">↗</div>

        <!-- 容器：用来动态放文字或图片 -->

        <div id="mediaContainer" class="quote-content">正在同步内容...</div>

        <div id="quoteSource" class="quote-source"></div>

    </div>



    <script>

        const API_URL = "https://你的项目名称.vercel.app/api/quotes";

        const PAGE_ID = "你的Notion页面ID";

        const NOTION_PAGE_URL = `https://www.notion.so/${PAGE_ID.replace(/-/g, '')}`;



        let currentBlockId = "";



        async function fetchNotionData() {

            try {

                const response = await fetch(API_URL);

                if (!response.ok) throw new Error("网络请求失败");

                const items = await response.json();



                if (items && items.length > 0) {

                    const selected = items[Math.floor(Math.random() * items.length)];

                    const container = document.getElementById('mediaContainer');

                    

                    // 清空旧内容

                    container.innerHTML = "";



                    if (selected.type === 'image') {

                        // 如果抽到的是图片

                        const img = document.createElement('img');

                        img.src = selected.content;

                        img.style.maxWidth = "100%";

                        img.style.borderRadius = "8px";

                        container.appendChild(img);

                        document.getElementById('quoteSource').innerText = "—— Notion 图片";

                    } else {

                        // 如果抽到的是文字

                        container.innerText = `『 ${selected.content} 』`;

                        document.getElementById('quoteSource').innerText = `—— ${selected.source}`;

                    }



                    currentBlockId = selected.id;

                } else {

                    document.getElementById('mediaContainer').innerText = '『 页面中暂未检测到内容 』';

                }

            } catch (error) {

                document.getElementById('mediaContainer').innerText = '『 哎呀，同步失败了，请检查网络 』';

            }

        }



        function openNotionPage() {

            let targetUrl = NOTION_PAGE_URL;

            if (currentBlockId) {

                targetUrl = `https://www.notion.so/${PAGE_ID.replace(/-/g, '')}#${currentBlockId.replace(/-/g, '')}`;

            }

            window.open(targetUrl, '_blank');

        }



        window.onload = fetchNotionData;

    </script>

</body>
