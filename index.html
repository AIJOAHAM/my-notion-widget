<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notion Dynamic Quote Widget</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100%;
            padding: 10px;
        }
        .quote-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 24px 32px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 0, 0, 0.04);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            /* 高度完全由内部多图和文案自动撑开 */
            height: auto; 
        }
        .quote-card:hover {
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
            transform: translateY(-2px);
            border-color: rgba(0, 0, 0, 0.08);
        }
        .quote-content {
            font-size: 16px;
            line-height: 1.8;
            color: #333333;
            letter-spacing: 0.5px;
            text-align: left;
            margin-bottom: 12px;
            word-break: break-word;
        }
        
        /* 多图自适应样式：每张图上下保持合适间距，绝不变形或溢出 */
        .quote-content img {
            display: block;
            width: 100%;
            height: auto;
            max-height: 450px;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 12px;
            background: #f9f9f9;
        }

        .quote-source {
            font-size: 13px;
            color: #888888;
            text-align: right;
            font-style: normal;
            margin-top: 8px;
        }
        .hint-icon {
            position: absolute;
            top: 10px;
            right: 14px;
            font-size: 11px;
            color: #bbb;
        }

        /* 针对安卓手机端等小屏幕的细节微调 */
        @media (max-width: 600px) {
            .quote-card {
                padding: 16px 20px;
            }
            .quote-content {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="quote-card" id="quoteCard" onclick="openNotionPage()">
        <div class="hint-icon">↗</div>
        <!-- 容器：动态承载文案与多张截图 -->
        <div id="mediaContainer" class="quote-content">正在同步你的金句库...</div>
        <div id="quoteSource" class="quote-source"></div>
    </div>

    <script>
        const API_URL = "https://my-notion-widget-nine.vercel.app/api/quotes";
        const PAGE_ID = "3c68b0b3e94d8045a5f3fe3db793ad1d";
        const NOTION_PAGE_URL = `https://www.notion.so/${PAGE_ID.replace(/-/g, '')}`;

        let currentBlockId = "";

        async function fetchNotionQuotes() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error("网络请求失败");

                const quotes = await response.json();

                if (quotes && quotes.length > 0) {
                    const randomIndex = Math.floor(Math.random() * quotes.length);
                    const selected = quotes[randomIndex];
                    const container = document.getElementById('mediaContainer');
                    
                    // 清空旧内容
                    container.innerHTML = "";

                    // 1. 循环渲染该条内容下的所有图片（支持 1 张或多张）
                    if (selected.images && selected.images.length > 0) {
                        selected.images.forEach(imgUrl => {
                            const img = document.createElement('img');
                            img.src = imgUrl;
                            container.appendChild(img);
                        });
                    }

                    // 2. 渲染文案段落
                    if (selected.text) {
                        const textDiv = document.createElement('div');
                        // 如果有图片则直接显示文案，如果是纯文字则带两侧引号
                        textDiv.innerText = (selected.images && selected.images.length > 0) ? selected.text : `『 ${selected.text} 』`;
                        container.appendChild(textDiv);
                    }

                    document.getElementById('quoteSource').innerText = `—— ${selected.source}`;
                    currentBlockId = selected.id;
                } else {
                    document.getElementById('mediaContainer').innerText = '『 Notion 页面中暂未检测到匹配的金句 』';
                }

            } catch (error) {
                console.error(error);
                document.getElementById('mediaContainer').innerText = '『 哎呀，同步金句失败了，请检查网络 』';
            }
        }

        function openNotionPage() {
            let targetUrl = NOTION_PAGE_URL;
            if (currentBlockId) {
                const cleanBlockId = currentBlockId.replace(/-/g, '');
                targetUrl = `https://www.notion.so/${PAGE_ID.replace(/-/g, '')}#${cleanBlockId}`;
            }
            window.open(targetUrl, '_blank');
        }

        window.onload = fetchNotionQuotes;
    </script>
</body>
</html>
