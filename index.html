<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notion Dynamic Quote Widget</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            /* 优化1：将原本死板的 height: 100vh 改为自适应，完美解决安卓和电脑端显示差异问题 */
            min-height: 100vh;
            width: 100%;
            padding: 10px;
        }
        .quote-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 24px 32px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 0, 0, 0.04);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            /* 核心：卡片高度完全由内部图文自动撑开，拒绝截断 */
            height: auto; 
        }
        .quote-card:hover {
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
            transform: translateY(-2px);
            border-color: rgba(0, 0, 0, 0.08);
        }
        .quote-content {
            font-size: 16px;
            line-height: 1.8;
            color: #333333;
            letter-spacing: 0.5px;
            text-align: left; /* 改为左对齐更适合图文混排阅读 */
            margin-bottom: 12px;
            word-break: break-word;
        }
        
        /* 优化2：针对截图增加自适应样式，确保在电脑和安卓手机上不超框、不变形 */
        .quote-content img {
            display: block;
            width: 100%;
            height: auto;
            max-height: 450px;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 12px;
            background: #f9f9f9;
        }

        .quote-source {
            font-size: 13px;
            color: #888888;
            text-align: right;
            font-style: normal;
            margin-top: 8px;
        }
        .hint-icon {
            position: absolute;
            top: 10px;
            right: 14px;
            font-size: 11px;
            color: #bbb;
        }

        /* 针对安卓手机端等小屏幕的细节微调 */
        @media (max-width: 600px) {
            .quote-card {
                padding: 16px 20px;
            }
            .quote-content {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="quote-card" id="quoteCard" onclick="openNotionPage()">
        <div class="hint-icon">↗</div>
        <!-- 容器：完美兼容文字和截图的动态混排 -->
        <div id="mediaContainer" class="quote-content">正在同步你的金句库...</div>
        <div id="quoteSource" class="quote-source"></div>
    </div>

    <script>
        // 你的 Vercel 动态 API 地址
        const API_URL = "https://my-notion-widget-nine.vercel.app/api/quotes";
        const PAGE_ID = "3c68b0b3e94d8045a5f3fe3db793ad1d";
        const NOTION_PAGE_URL = `https://www.notion.so/${PAGE_ID.replace(/-/g, '')}`;

        let currentBlockId = "";

        async function fetchNotionQuotes() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error("网络请求失败");

                const quotes = await response.json();

                if (quotes && quotes.length > 0) {
                    const randomIndex = Math.floor(Math.random() * quotes.length);
                    const selected = quotes[randomIndex];
                    const container = document.getElementById('mediaContainer');
                    
                    // 清空旧内容
                    container.innerHTML = "";

                    // 1. 如果该条内容带有截图，优先渲染图片
                    if (selected.image) {
                        const img = document.createElement('img');
                        img.src = selected.image;
                        container.appendChild(img);
                    }

                    // 2. 如果带有文案段落，渲染文案
                    if (selected.text) {
                        const textDiv = document.createElement('div');
                        textDiv.innerText = selected.image ? selected.text : `『 ${selected.text} 』`;
                        container.appendChild(textDiv);
                    }

                    document.getElementById('quoteSource').innerText = `—— ${selected.source}`;
                    currentBlockId = selected.id;
                } else {
                    document.getElementById('mediaContainer').innerText = '『 Notion 页面中暂未检测到匹配的金句 』';
                }

            } catch (error) {
                console.error(error);
                document.getElementById('mediaContainer').innerText = '『 哎呀，同步金句失败了，请检查网络 』';
            }
        }

        function openNotionPage() {
            let targetUrl = NOTION_PAGE_URL;
            if (currentBlockId) {
                const cleanBlockId = currentBlockId.replace(/-/g, '');
                targetUrl = `https://www.notion.so/${PAGE_ID.replace(/-/g, '')}#${cleanBlockId}`;
            }
            window.open(targetUrl, '_blank');
        }

        window.onload = fetchNotionQuotes;
    </script>
</body>
</html>
