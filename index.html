<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notion Dynamic Quote Widget</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80px;
            width: 100%;
            padding: 6px;
        }

        .quote-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 20px 24px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 0, 0, 0.04);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            /* 核心：高度完全由内部图文自动撑开，解决安卓和电脑端显示差异 */
            height: auto; 
        }

        .quote-card:hover {
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
            transform: translateY(-2px);
            border-color: rgba(0, 0, 0, 0.08);
        }

        .quote-content {
            font-size: 15px;
            line-height: 1.7;
            color: #333333;
            letter-spacing: 0.3px;
            text-align: left;
            margin-bottom: 12px;
            word-break: break-word;
        }

        /* 核心优化：确保图片在手机和电脑上完美自适应大小，绝不变形、截断 */
        .quote-content img {
            display: block;
            width: 100%;
            height: auto;
            max-height: 500px; /* 限制最大高度，防止超长图过分刷屏 */
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 12px;
            background: #fafafa;
        }

        .quote-source {
            font-size: 12px;
            color: #888888;
            text-align: right;
            font-style: normal;
        }

        .hint-icon {
            position: absolute;
            top: 8px;
            right: 10px;
            font-size: 11px;
            color: #bbb;
        }

        /* 针对安卓手机端等小屏幕的自适应微调 */
        @media (max-width: 600px) {
            .quote-card {
                padding: 14px 16px;
                border-radius: 10px;
            }
            .quote-content {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="quote-card" id="quoteCard" onclick="openNotionPage()">
        <div class="hint-icon">↗</div>
        <div id="mediaContainer" class="quote-content">正在同步你的金句库...</div>
        <div id="quoteSource" class="quote-source"></div>
    </div>

    <script>
        // ⚠️ 请确保这里的网址是你的 Vercel 主域名
        const API_URL = "https://my-notion-widget-nine.vercel.app/api/quotes";
        const PAGE_ID = "3c68b0b3e94d8045a5f3fe3db793ad1d";
        const NOTION_PAGE_URL = `https://www.notion.so/${PAGE_ID.replace(/-/g, '')}`;

        let currentBlockId = "";

        async function fetchNotionQuotes() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error("网络请求失败");

                const quotes = await response.json();

                if (quotes && quotes.length > 0) {
                    const randomIndex = Math.floor(Math.random() * quotes.length);
                    const selected = quotes[randomIndex];
                    const container = document.getElementById('mediaContainer');
                    
                    container.innerHTML = "";

                    // 1. 如果该条内容包含图片（如聊天截图），则先渲染图片
                    if (selected.image) {
                        const img = document.createElement('img');
                        img.src = selected.image;
                        container.appendChild(img);
                    }

                    // 2. 如果包含文字或标题，则渲染文字
                    if (selected.text) {
                        const textDiv = document.createElement('div');
                        // 如果是纯文字金句保留引号包裹，如果是图文混排则直接显示文本说明
                        textDiv.innerText = selected.image ? selected.text : `『 ${selected.text} 』`;
                        container.appendChild(textDiv);
                    }

                    document.getElementById('quoteSource').innerText = `—— ${selected.source}`;
                    currentBlockId = selected.id;
                } else {
                    document.getElementById('mediaContainer').innerText = '『 Notion 页面中暂未检测到匹配的内容 』';
                }

            } catch (error) {
                console.error(error);
                document.getElementById('mediaContainer').innerText = '『 哎呀, 同步金句失败了, 请检查网络 』';
            }
        }

        function openNotionPage() {
            let targetUrl = NOTION_PAGE_URL;
            if (currentBlockId) {
                const cleanBlockId = currentBlockId.replace(/-/g, '');
                targetUrl = `https://www.notion.so/${PAGE_ID.replace(/-/g, '')}#${cleanBlockId}`;
            }
            window.open(targetUrl, '_blank');
        }

        window.onload = fetchNotionQuotes;
    </script>
</body>
</html>
