<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notion Dynamic Card Widget</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80px;
            width: 100%;
            padding: 6px;
        }

        .quote-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 18px 22px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 0, 0, 0.04);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            /* 关键：高度完全由内部图文自动撑开，多长显示多高，完美适应手机/电脑 */
            height: auto; 
        }

        .quote-card:hover {
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
            transform: translateY(-2px);
            border-color: rgba(0, 0, 0, 0.08);
        }

        .quote-content {
            font-size: 15px;
            line-height: 1.6;
            color: #333333;
            letter-spacing: 0.3px;
            text-align: left;
            word-break: break-word;
        }

        /* 图片自适应排版：防止截图过大撑破卡片 */
        .quote-content img {
            display: block;
            width: 100%;
            height: auto;
            max-height: 450px;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 12px;
            background: #f9f9f9;
        }

        .quote-source {
            font-size: 12px;
            color: #888888;
            text-align: right;
            margin-top: 10px;
        }

        .hint-icon {
            position: absolute;
            top: 8px;
            right: 10px;
            font-size: 11px;
            color: #bbb;
        }

        /* 安卓等移动端设备的专属微调 */
        @media (max-width: 600px) {
            .quote-card {
                padding: 14px 16px;
                border-radius: 10px;
            }
            .quote-content {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="quote-card" id="quoteCard" onclick="openNotionPage()">
        <div class="hint-icon">↗</div>
        <div id="mediaContainer" class="quote-content">正在同步内容...</div>
        <div id="quoteSource" class="quote-source"></div>
    </div>

    <script>
        // ⚠️ 确保这里的域名是你最新的 Vercel 主域名
        const API_URL = "https://my-notion-widget-nine.vercel.app/api/quotes";
        const PAGE_ID = "3c68b0b3e94d8045a5f3fe3db793ad1d";
        const NOTION_PAGE_URL = `https://www.notion.so/${PAGE_ID.replace(/-/g, '')}`;

        let currentBlockId = "";

        async function fetchNotionData() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error("网络请求失败");

                const items = await response.json();

                if (items && items.length > 0) {
                    const randomIndex = Math.floor(Math.random() * items.length);
                    const selected = items[randomIndex];
                    const container = document.getElementById('mediaContainer');
                    
                    container.innerHTML = "";

                    // 如果有图片（如你截图里的聊天截图），优先渲染图片
                    if (selected.image) {
                        const img = document.createElement('img');
                        img.src = selected.image;
                        container.appendChild(img);
                    }

                    // 如果有文字（如你截图上方的标题或段落说明），渲染在对应位置
                    if (selected.text) {
                        const textDiv = document.createElement('div');
                        textDiv.innerText = selected.image ? selected.text : `${selected.text}`;
                        container.appendChild(textDiv);
                    }

                    document.getElementById('quoteSource').innerText = `—— ${selected.source}`;
                    currentBlockId = selected.id;
                } else {
                    container.innerText = '『 Notion 页面中暂未检测到内容 』';
                }

            } catch (error) {
                console.error(error);
                document.getElementById('mediaContainer').innerText = '『 哎呀，同步失败了，请检查网络 』';
            }
        }

        function openNotionPage() {
            let targetUrl = NOTION_PAGE_URL;
            if (currentBlockId) {
                const cleanBlockId = currentBlockId.replace(/-/g, '');
                targetUrl = `https://www.notion.so/${PAGE_ID.replace(/-/g, '')}#${cleanBlockId}`;
            }
            window.open(targetUrl, '_blank');
        }

        window.onload = fetchNotionData;
    </script>
</body>
</html>
