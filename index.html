<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notion Dynamic Quote Widget</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* 核心修改：移除强制占满全屏的 100vh，改为自适应内容高度 */
        body {
            background-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100px;
            width: 100%;
            padding: 8px; /* 减少手机端边缘留白 */
        }

        .quote-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 20px 24px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 0, 0, 0.04);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            /* 允许卡片根据内部文字多少自动拉伸高度 */
            height: auto; 
        }

        .quote-card:hover {
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
            transform: translateY(-2px);
            border-color: rgba(0, 0, 0, 0.08);
        }

        .quote-content {
            font-size: 15px;
            line-height: 1.7;
            color: #333333;
            letter-spacing: 0.3px;
            text-align: left; /* 改为左对齐或居中，长文阅读体验更好 */
            margin-bottom: 10px;
            word-break: break-word; /* 防止长英文或无空格字符撑破排版 */
        }

        .quote-source {
            font-size: 12px;
            color: #888888;
            text-align: right;
            font-style: normal;
        }

        .hint-icon {
            position: absolute;
            top: 8px;
            right: 10px;
            font-size: 11px;
            color: #bbb;
        }

        /* 针对手机端（屏幕宽度小于 600px）的专属微调 */
        @media (max-width: 600px) {
            .quote-card {
                padding: 16px 18px;
                border-radius: 10px;
            }
            .quote-content {
                font-size: 14px; /* 手机端稍微缩小字号，容纳更多内容 */
            }
        }
    </style>
</head>
<body>

    <div class="quote-card" id="quoteCard" onclick="openNotionPage()">
        <div class="hint-icon">↗</div>
        <div id="quoteText" class="quote-content">正在同步你的金句库...</div>
        <div id="quoteSource" class="quote-source"></div>
    </div>

    <script>
        // ⚠️ 请确保这里的域名是你最新的 Vercel 主域名
        const API_URL = "https://my-notion-widget-nine.vercel.app/api/quotes";
        const PAGE_ID = "3c68b0b3e94d8045a5f3fe3db793ad1d";
        const NOTION_PAGE_URL = `https://www.notion.so/${PAGE_ID.replace(/-/g, '')}`;

        let currentBlockId = "";

        async function fetchNotionQuotes() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error("网络请求失败");

                const quotes = await response.json();

                if (quotes && quotes.length > 0) {
                    const randomIndex = Math.floor(Math.random() * quotes.length);
                    const selected = quotes[randomIndex];

                    document.getElementById('quoteText').innerText = `『 ${selected.text} 』`;
                    document.getElementById('quoteSource').innerText = `—— ${selected.source}`;
                    currentBlockId = selected.id;
                } else {
                    document.getElementById('quoteText').innerText = '『 Notion 页面中暂未检测到匹配的金句 』';
                }

            } catch (error) {
                console.error(error);
                document.getElementById('quoteText').innerText = '『 哎呀，同步金句失败了，请检查网络 』';
            }
        }

        function openNotionPage() {
            let targetUrl = NOTION_PAGE_URL;
            if (currentBlockId) {
                const cleanBlockId = currentBlockId.replace(/-/g, '');
                targetUrl = `https://www.notion.so/${PAGE_ID.replace(/-/g, '')}#${cleanBlockId}`;
            }
            window.open(targetUrl, '_blank');
        }

        window.onload = fetchNotionQuotes;
    </script>
</body>
</html>
